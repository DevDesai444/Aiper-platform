name: aiper

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aiper_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aiper_password}
      POSTGRES_DB: ${POSTGRES_DB:-aiper_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aiper_user} -d ${POSTGRES_DB:-aiper_db}"]
      interval: 5s
      timeout: 5s
      retries: 20

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      QDRANT_HOST: qdrant
      STORAGE_DIR: /data/uploads
      # The API serves as the unprivileged aiper_app role (created by migration
      # 0003, subject to row-level security); migrations and boot-time seeding
      # use the privileged bootstrap role.
      DATABASE_URL: postgresql+asyncpg://aiper_app:${AIPER_APP_DB_PASSWORD:-aiper_app_password}@postgres:5432/${POSTGRES_DB:-aiper_db}
      ALEMBIC_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-aiper_user}:${POSTGRES_PASSWORD:-aiper_password}@postgres:5432/${POSTGRES_DB:-aiper_db}
      AIPER_APP_DB_PASSWORD: ${AIPER_APP_DB_PASSWORD:-aiper_app_password}
      # Dev/demo: keep the legacy self-issued login working until the frontend
      # moves to supabase-js. Remove (or set 0) and configure SUPABASE_URL +
      # SUPABASE_JWT_SECRET to switch to the production Supabase identity path.
      AUTH_LEGACY_LOGIN_ENABLED: "1"
      AIPER_DEV_MODE: "1"
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  qdrant_data:
  uploads_data:
