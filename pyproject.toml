[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# Lenient-but-real: pycodestyle, pyflakes, isort, flake8-bugbear, pyupgrade.
# Skipped: docstrings (D), type annotations (ANN), copyright (CPY),
#          complexity (C9, PLR), type-checking blocks (TC), bandit false-positives.
select = ["E", "F", "I", "B", "UP"]
ignore = [
    "B008",   # FastAPI uses File()/Form() as default arg values by design
    "UP017",  # datetime.UTC alias — deferred to each lane's cleanup pass
]

[tool.ruff.lint.per-file-ignores]
"backend/app/services/templates.py" = ["E501"]   # long string literals in seed data
"backend/tests/*" = ["S101"]  # assert is expected in tests

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
