# Alembic configuration.
#
# The schema is owned by migrations: the application never calls create_all.
# Run every command from the `backend/` directory so that `app` is importable:
#
#     alembic upgrade head
#     alembic revision --autogenerate -m "..."
#
# The database URL is resolved in alembic/env.py, not here, so that one code
# path serves the container, local development and CI. Precedence:
#   1. -x db_url=postgresql+asyncpg://...
#   2. $ALEMBIC_DATABASE_URL
#   3. settings.database_url  (itself overridable with $DATABASE_URL)

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
